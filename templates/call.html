<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #131c2e;
            --panel-2: #1a2438;
            --border: #253046;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #e5ecf5;
            --muted: #8a9bb0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 0%, #14203a 0%, var(--bg) 55%);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
        }

        /* --- Connection status pill (top-right) --- */
        .conn-pill {
            position: fixed; top: 20px; right: 20px;
            display: flex; align-items: center; gap: 8px;
            padding: 8px 14px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.78rem;
            color: var(--muted);
            z-index: 100;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
        .dot.connected { background: var(--success); }
        .dot.disconnected { background: var(--danger); }
        .dot.connecting { animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        /* --- Card --- */
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 2.5rem 2.25rem;
            border-radius: 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
        }
        h1 {
            font-size: 1.4rem; font-weight: 700; margin: 0 0 6px;
            letter-spacing: -0.01em;
        }
        .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.75rem; }

        /* --- Inputs --- */
        label { display: block; font-size: 0.78rem; font-weight: 600;
                color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
        .input-wrap { display: flex; gap: 8px; margin-bottom: 6px; }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem 0.9rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        input[type="text"].invalid { border-color: var(--danger); }

        /* --- Buttons --- */
        button {
            padding: 0.75rem 1.1rem;
            border: none; border-radius: 10px;
            font-weight: 600; font-size: 0.92rem;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            position: relative;
        }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:not(:disabled):hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:not(:disabled):hover { background: #223050; }
        .btn-danger { background: var(--danger); color: #fff; width: 100%; margin-top: 1rem; }
        .btn-danger:hover { background: #d63737; }
        .btn-full { width: 100%; }

        /* --- Spinner --- */
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        button.loading .spinner { display: inline-block; }
        button.loading .label { opacity: 0.7; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Inline error --- */
        .inline-error {
            color: var(--danger);
            font-size: 0.8rem;
            margin: 0 0 1rem;
            min-height: 1.1em;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .inline-error.visible { opacity: 1; }

        /* --- Voice upload box --- */
        .upload-box {
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 1.1rem;
            margin-bottom: 0.75rem;
            background: var(--panel-2);
        }
        .upload-box .label-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .upload-box label { margin: 0; }
        .file-name { font-size: 0.8rem; color: var(--muted); }
        input[type="file"] { display: none; }
        .file-label {
            display: block; width: 100%;
            padding: 0.65rem;
            text-align: center;
            border-radius: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .file-label:hover { color: var(--text); border-color: var(--accent); }

        /* --- Call state panel --- */
        .room-info {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1rem;
        }
        .room-info .code { font-family: 'SF Mono', Consolas, monospace;
                            font-size: 1rem; font-weight: 600; letter-spacing: 0.05em; }
        .badge {
            font-size: 0.7rem; padding: 3px 8px; border-radius: 6px;
            background: rgba(59,130,246,0.15); color: #93c5fd;
            font-weight: 600; letter-spacing: 0.03em;
        }
        .badge.host { background: rgba(34,197,94,0.15); color: #86efac; }

        /* --- Toasts --- */
        .toast-container {
            position: fixed; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 200;
        }
        .toast {
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text);
            min-width: 260px; max-width: 340px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--success); }
        .toast.warning { border-left-color: var(--warning); }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Connection pill -->
    <div class="conn-pill">
        <span class="dot connecting" id="connDot"></span>
        <span id="connText">Connecting…</span>
    </div>

    <!-- Main card -->
    <div class="card">
        <h1>VoiceClone Call</h1>
        <p class="sub">Create a room or join an existing one to start a voice-cloned call.</p>

        <!-- Lobby -->
        <section id="lobby">
            <label for="roomInput">Room code</label>
            <div class="input-wrap">
                <input type="text" id="roomInput" placeholder="e.g. team-standup-01" autocomplete="off" />
                <button class="btn-primary" id="createBtn" onclick="createRoom()">
                    <span class="spinner"></span><span class="label">Create</span>
                </button>
            </div>
            <p class="inline-error" id="lobbyError"></p>
            <button class="btn-secondary btn-full" id="joinBtn" onclick="joinRoom()">
                <span class="spinner"></span><span class="label">Join Room</span>
            </button>
        </section>

        <!-- Call -->
        <section id="callUI" class="hidden">
            <div class="room-info">
                <span class="badge host" id="roleBadge">Host</span>
                <span class="code" id="roomCode">—</span>
            </div>

            <div class="upload-box" id="uploadBox">
                <div class="label-row">
                    <label>Reference voice</label>
                    <span class="file-name" id="fileName">No file selected</span>
                </div>
                <input type="file" id="voiceFile" accept="audio/*" onchange="onFileSelected()" />
                <label class="file-label" for="voiceFile">Choose WAV file (3–10s)</label>
                <button class="btn-secondary btn-full" id="uploadBtn" style="margin-top:10px;" onclick="uploadVoice()">
                    <span class="spinner"></span><span class="label">Set Clone Voice</span>
                </button>
            </div>

            <p class="inline-error" id="callError"></p>
            <button class="btn-danger" onclick="leaveCall()">Leave Call</button>
        </section>
    </div>

    <!-- Toasts -->
    <div class="toast-container" id="toasts"></div>

    <!-- Lynkio JS client -->
    <script src="https://voice-call-production-c89f.up.railway.app/lynkio/client.js"></script>
    <script>
  /* -------------------------------------------------------
   TOAST + INLINE ERROR HELPERS
------------------------------------------------------- */
function showToast(message, type = 'info', timeout = 4000) {
    const container = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    container.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
    }, timeout);
}
function setInlineError(id, message) {
    const el = document.getElementById(id);
    el.textContent = message || '';
    el.classList.toggle('visible', !!message);
}
function setLoading(id, loading) {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.classList.toggle('loading', loading);
    btn.disabled = loading;
}
function setConn(state) {
    document.getElementById('connDot').className = 'dot ' + state;
    document.getElementById('connText').textContent =
        state === 'connected' ? 'Connected' :
        state === 'disconnected' ? 'Disconnected' :
        'Connecting…';
}
/* -------------------------------------------------------
   LYNKIO CLIENT
------------------------------------------------------- */
const client = new LynkClient(
    "wss://voice-call-production-c89f.up.railway.app"
);
let isConnected = false;
let roomId = null;
let isHost = false;
let micStarted = false;
let micStream = null;
let audioContext = null;
let micSource = null;
let micProcessor = null;
let silentGain = null;
/* -------------------------------------------------------
   INITIALIZE CONNECTION
------------------------------------------------------- */
document.addEventListener('DOMContentLoaded', async () => {
    setConn('connecting');
    try {
        await client.connect();
        isConnected = true;
        setConn('connected');
        showToast('Connected to server.', 'success', 2500);
    } catch (error) {
        isConnected = false;
        setConn('disconnected');
        console.error('Lynkio connection error:', error);
        showToast('Unable to connect to server.', 'error');
    }
});
/* -------------------------------------------------------
   CONNECTION EVENTS
------------------------------------------------------- */
client.on('disconnected', () => {
    isConnected = false;
    setConn('disconnected');
    setLoading('createBtn', false);
    setLoading('joinBtn', false);
    setLoading('uploadBtn', false);
    showToast('Connection lost.', 'warning');
});
client.on('reconnecting', () => {
    isConnected = false;
    setConn('connecting');
});
/* -------------------------------------------------------
   ROOM EVENTS
------------------------------------------------------- */
client.on('room_created', (data) => {
    console.log('Room created:', data);
    roomId = data.room_id;
    isHost = true;
    setLoading('createBtn', false);
    enterCall();
    showToast(
        `Room "${roomId}" created. Waiting for a joiner.`,
        'success'
    );
});
client.on('room_joined', (data) => {
    console.log('Room joined:', data);
    roomId = data.room_id || roomId;
    isHost = false;
    setLoading('joinBtn', false);
    enterCall();
});
client.on('joiner_connected', (data) => {
    console.log('Joiner connected:', data);
    showToast('Joiner connected.', 'success');
});
/* -------------------------------------------------------
   VOICE EVENTS
------------------------------------------------------- */
client.on('voice_ready', () => {
    setLoading('uploadBtn', false);
    showToast('Clone voice applied.', 'success');
});
client.on('cloned_audio', (data) => {
    playPCM(data);
});
client.on('raw_audio', (data) => {
    playPCM(data);
});
/* -------------------------------------------------------
   ERROR EVENTS
------------------------------------------------------- */
client.on('error', (payload) => {
    console.error('Server error:', payload);
    const message =
        payload?.message || 'An unexpected server error occurred.';
    const lobby = document.getElementById('lobby');
    if (lobby.classList.contains('hidden')) {
        setInlineError('callError', message);
    } else {
        setInlineError('lobbyError', message);
    }
    setLoading('createBtn', false);
    setLoading('joinBtn', false);
    setLoading('uploadBtn', false);
    showToast(message, 'error');
});
/* -------------------------------------------------------
   CONNECTION GUARD
------------------------------------------------------- */
function requireConnection() {
    if (!isConnected) {
        showToast(
            'Please wait for the Lynkio connection.',
            'warning'
        );
        return false;
    }
    return true;
}
/* -------------------------------------------------------
   CREATE ROOM
------------------------------------------------------- */
function createRoom() {
    if (!requireConnection()) return;
    const id = document.getElementById('roomInput').value.trim();
    if (!id) {
        setInlineError('lobbyError', 'Please enter a room code.');
        return;
    }
    setInlineError('lobbyError', '');
    setLoading('createBtn', true);
    client.emit('create_room', {
        room_id: id
    });
}
/* -------------------------------------------------------
   JOIN ROOM
------------------------------------------------------- */
function joinRoom() {
    if (!requireConnection()) return;
    const id = document.getElementById('roomInput').value.trim();
    if (!id) {
        setInlineError('lobbyError', 'Please enter a room code.');
        return;
    }
    setInlineError('lobbyError', '');
    roomId = id;
    isHost = false;
    setLoading('joinBtn', true);
    client.emit('join_room', {
        room_id: id
    });
}
/* -------------------------------------------------------
   ENTER CALL
------------------------------------------------------- */
async function enterCall() {
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('callUI').classList.remove('hidden');
    document.getElementById('roomCode').textContent = roomId;
    const badge = document.getElementById('roleBadge');
    badge.textContent = isHost ? 'Host' : 'Joiner';
    badge.classList.toggle('host', isHost);
    if (!isHost) {
        document.getElementById('uploadBox').classList.add('hidden');
    }
    await startMic();
}
/* -------------------------------------------------------
   LEAVE CALL
------------------------------------------------------- */
function leaveCall() {
    stopMic();
    window.location.reload();
}
/* -------------------------------------------------------
   VOICE FILE SELECTION
------------------------------------------------------- */
function onFileSelected() {
    const file = document.getElementById('voiceFile').files[0];
    document.getElementById('fileName').textContent =
        file ? file.name : 'No file selected';
}
/* -------------------------------------------------------
   UPLOAD REFERENCE VOICE
------------------------------------------------------- */
function uploadVoice() {
    if (!requireConnection()) return;
    const file = document.getElementById('voiceFile').files[0];
    if (!file) {
        setInlineError('callError', 'Select a WAV file before uploading.');
        return;
    }
    setInlineError('callError', '');
    setLoading('uploadBtn', true);
    const reader = new FileReader();
    reader.onload = () => {
        try {
            client.sendBinary(
                'voice_reference',
                new Uint8Array(reader.result)
            );
        } catch (error) {
            console.error('Voice upload error:', error);
            setLoading('uploadBtn', false);
            setInlineError('callError', 'Voice upload failed.');
        }
    };
    reader.onerror = () => {
        setLoading('uploadBtn', false);
        setInlineError('callError', 'Could not read the selected file.');
    };
    reader.readAsArrayBuffer(file);
}
/* -------------------------------------------------------
   MICROPHONE CAPTURE
------------------------------------------------------- */
async function startMic() {
    if (micStarted) return;
    try {
        micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                channelCount: 1,
                echoCancellation: true,
                noiseSuppression: true
            }
        });
        audioContext = new AudioContext({
            sampleRate: 24000
        });
        await audioContext.resume();
        micSource = audioContext.createMediaStreamSource(micStream);
        micProcessor = audioContext.createScriptProcessor(
            4096,
            1,
            1
        );
        silentGain = audioContext.createGain();
        silentGain.gain.value = 0;
        micProcessor.onaudioprocess = (event) => {
            if (!micStarted || !isConnected) return;
            const input = event.inputBuffer.getChannelData(0);
            const pcm16 = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                const sample = Math.max(-1, Math.min(1, input[i]));
                pcm16[i] = sample < 0
                    ? sample * 32768
                    : sample * 32767;
            }
            try {
                client.sendBinary(
                    'raw_mic',
                    new Uint8Array(pcm16.buffer)
                );
            } catch (error) {
                console.error('Microphone transmission error:', error);
            }
        };
        micSource.connect(micProcessor);
        micProcessor.connect(silentGain);
        silentGain.connect(audioContext.destination);
        micStarted = true;
    } catch (error) {
        console.error('Microphone error:', error);
        showToast(
            'Microphone access failed: ' + error.message,
            'error'
        );
    }
}
/* -------------------------------------------------------
   STOP MICROPHONE
------------------------------------------------------- */
function stopMic() {
    micStarted = false;
    if (micProcessor) {
        micProcessor.disconnect();
        micProcessor = null;
    }
    if (micSource) {
        micSource.disconnect();
        micSource = null;
    }
    if (silentGain) {
        silentGain.disconnect();
        silentGain = null;
    }
    if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
        micStream = null;
    }
    if (audioContext) {
        audioContext.close();
        audioContext = null;
    }
}
/* -------------------------------------------------------
   PCM16 AUDIO PLAYBACK
------------------------------------------------------- */
function playPCM(data) {
    if (!data) return;
    if (!audioContext || audioContext.state === 'closed') {
        audioContext = new AudioContext({
            sampleRate: 24000
        });
    }
    if (audioContext.state === 'suspended') {
        audioContext.resume();
    }
    let pcm;
    if (data instanceof ArrayBuffer) {
        pcm = new Int16Array(data);
    } else if (ArrayBuffer.isView(data)) {
        pcm = new Int16Array(
            data.buffer,
            data.byteOffset,
            Math.floor(data.byteLength / 2)
        );
    } else {
        console.error('Unsupported PCM format:', data);
        return;
    }
    if (!pcm.length) return;
    const buffer = audioContext.createBuffer(
        1,
        pcm.length,
        24000
    );
    const channel = buffer.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) {
        channel[i] = pcm[i] / 32768;
    }
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start();
}
    </script>
</body>
</html>
