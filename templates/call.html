<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --text: #e2e8f0; --danger: #ef4444; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: var(--panel);
            padding: 2.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; font-weight: 600; }
        p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
        .input-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        button {
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: #334155; color: var(--text); }
        .btn-danger { background: var(--danger); color: white; width: 100%; margin-top: 1rem; }
        .status { margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8; min-height: 1.2rem; text-align: center; }
        .hidden { display: none; }
        .upload-box {
            border: 1px dashed #475569;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .upload-box p { font-size: 0.8rem; margin: 0 0 0.5rem; color: #94a3b8; }
        .upload-box input[type="file"] { font-size: 0.8rem; color: var(--text); }
    </style>
</head>
<body>
    <div class="card">
        <h1>VoiceClone Call</h1>
        <p class="sub">Create a room or join an existing one.</p>

        <!-- Lobby View -->
        <div id="lobby">
            <div class="input-group">
                <input type="text" id="roomInput" placeholder="Enter room code" />
                <button class="btn-primary" onclick="createRoom()">Create</button>
            </div>
            <button class="btn-secondary" style="width:100%;" onclick="joinRoom()">Join Room</button>
        </div>

        <!-- Call View -->
        <div id="callUI" class="hidden">
            <div class="upload-box">
                <p>Upload a 3–10s WAV file of your voice.</p>
                <input type="file" id="voiceFile" accept="audio/*" />
                <button class="btn-secondary" style="width:100%; margin-top:0.75rem; font-size:0.85rem;" onclick="uploadVoice()">
                    Set Clone Voice
                </button>
            </div>
            <button class="btn-danger" onclick="leaveCall()">Leave Call</button>
        </div>

        <div class="status" id="status">Connecting…</div>
    </div>

    <!-- Lynkio JS Client -->
    <script src="/lynkio/client.js"></script>
    <script>
        // Initialize Lynkio Client
        const client = new LynkClient(`ws://${location.host}`);
        const statusEl = document.getElementById('status');

        client.on('connected', () => {
            statusEl.textContent = 'Connected. Enter a room code.';
        });

        client.on('room_created', (data) => {
            statusEl.textContent = `Room ${data.room_id} created. Waiting for joiner…`;
            showCallUI();
            startMic(true); // Host mode
        });

        client.on('joiner_connected', () => {
            statusEl.textContent = 'Joiner connected. You can start speaking.';
        });

        client.on('cloned_audio', (audioBytes) => {
            playPCM(audioBytes);
        });

        client.on('raw_audio', (audioBytes) => {
            // Host receives joiner's raw audio here
            playPCM(audioBytes);
        });

        client.on('error', (msg) => {
            statusEl.textContent = `Error: ${msg.message}`;
        });

        // Connect
        client.connect();

        // --- Room Actions ---
        function createRoom() {
            const id = document.getElementById('roomInput').value.trim();
            if (!id) return alert('Please enter a room code.');
            client.emit('create_room', { room_id: id });
        }

        function joinRoom() {
            const id = document.getElementById('roomInput').value.trim();
            if (!id) return alert('Please enter a room code.');
            client.emit('join_room', { room_id: id });
            showCallUI();
            startMic(false); // Joiner mode
        }

        function showCallUI() {
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('callUI').classList.remove('hidden');
        }

        function leaveCall() {
            window.location.reload();
        }

        // --- Voice Reference Upload ---
        function uploadVoice() {
            const file = document.getElementById('voiceFile').files[0];
            if (!file) return alert('Please select an audio file.');
            const reader = new FileReader();
            reader.onload = () => {
                const arrayBuffer = reader.result;
                client.sendBinaryEvent('voice_reference', new Uint8Array(arrayBuffer));
                statusEl.textContent = 'Voice reference uploaded.';
            };
            reader.readAsArrayBuffer(file);
        }

        // --- Microphone Capture (Simplified PCM) ---
        async function startMic(isHost) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioCtx = new AudioContext({ sampleRate: 24000 });
                const source = audioCtx.createMediaStreamSource(stream);
                const processor = audioCtx.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (e) => {
                    const input = e.inputBuffer.getChannelData(0);
                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) {
                        pcm16[i] = Math.max(-1, Math.min(1, input[i])) * 0x7FFF;
                    }
                    client.sendBinaryEvent('raw_mic', new Uint8Array(pcm16.buffer));
                };

                source.connect(processor);
                processor.connect(audioCtx.destination);
            } catch (err) {
                alert('Microphone error: ' + err.message);
            }
        }

        // --- Playback (Simplified PCM) ---
        function playPCM(arrayBuffer) {
            const ctx = new AudioContext({ sampleRate: 24000 });
            ctx.decodeAudioData(arrayBuffer).then(buffer => {
                const src = ctx.createBufferSource();
                src.buffer = buffer;
                src.connect(ctx.destination);
                src.start();
            }).catch(e => console.warn('Playback error', e));
        }
    </script>
</body>
</html>
