<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #131c2e;
            --panel-2: #1a2438;
            --border: #253046;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #e5ecf5;
            --muted: #8a9bb0;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 0%, #14203a 0%, var(--bg) 55%);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
        }

        /* ---------- Connection pill ---------- */
        .conn-pill {
            position: fixed; top: 20px; right: 20px;
            display: flex; align-items: center; gap: 8px;
            padding: 8px 14px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.78rem;
            color: var(--muted);
            z-index: 100;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
        .dot.connected { background: var(--success); }
        .dot.disconnected { background: var(--danger); }
        .dot.connecting { animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        /* ---------- Card ---------- */
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 2.5rem 2.25rem;
            border-radius: 18px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
        }
        h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
        .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.75rem; }

        /* ---------- Inputs ---------- */
        label { display: block; font-size: 0.78rem; font-weight: 600;
                color: var(--muted); margin-bottom: 6px;
                text-transform: uppercase; letter-spacing: 0.04em; }
        .input-wrap { display: flex; gap: 8px; margin-bottom: 6px; }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem 0.9rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        input[type="text"].invalid { border-color: var(--danger); }

        /* ---------- Buttons ---------- */
        button {
            padding: 0.75rem 1.1rem;
            border: none; border-radius: 10px;
            font-weight: 600; font-size: 0.92rem;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            position: relative;
        }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:not(:disabled):hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:not(:disabled):hover { background: #223050; }
        .btn-danger { background: var(--danger); color: #fff; width: 100%; margin-top: 0.6rem; }
        .btn-danger:hover { background: #d63737; }
        .btn-full { width: 100%; }

        /* ---------- Spinner ---------- */
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        button.loading .spinner { display: inline-block; }
        button.loading .label { opacity: 0.7; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Inline error ---------- */
        .inline-error {
            color: var(--danger);
            font-size: 0.8rem;
            margin: 0 0 1rem;
            min-height: 1.1em;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .inline-error.visible { opacity: 1; }

        /* ---------- Voice upload box ---------- */
        .upload-box {
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 1.1rem;
            margin-bottom: 0.75rem;
            background: var(--panel-2);
        }
        .upload-box .label-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .upload-box label { margin: 0; }
        .file-name { font-size: 0.8rem; color: var(--muted); }
        input[type="file"] { display: none; }
        .file-label {
            display: block; width: 100%;
            padding: 0.65rem;
            text-align: center;
            border-radius: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .file-label:hover { color: var(--text); border-color: var(--accent); }

        /* ---------- Call state panel ---------- */
        .room-info {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1rem;
        }
        .room-info .code { font-family: 'SF Mono', Consolas, monospace;
                            font-size: 1rem; font-weight: 600; letter-spacing: 0.05em; }
        .badge {
            font-size: 0.7rem; padding: 3px 8px; border-radius: 6px;
            background: rgba(59,130,246,0.15); color: #93c5fd;
            font-weight: 600; letter-spacing: 0.03em;
        }
        .badge.host { background: rgba(34,197,94,0.15); color: #86efac; }

        /* ---------- Toasts ---------- */
        .toast-container {
            position: fixed; bottom: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 200;
        }
        .toast {
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text);
            min-width: 260px; max-width: 340px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: var(--danger); }
        .toast.success { border-left-color: var(--success); }
        .toast.warning { border-left-color: var(--warning); }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Connection pill -->
    <div class="conn-pill">
        <span class="dot connecting" id="connDot"></span>
        <span id="connText">Connecting…</span>
    </div>

    <!-- Main card -->
    <div class="card">
        <h1>VoiceClone Call</h1>
        <p class="sub">Create a room or join an existing one to start a voice-cloned call.</p>

        <!-- Lobby -->
        <section id="lobby">
            <label for="roomInput">Room code</label>
            <div class="input-wrap">
                <input type="text" id="roomInput" placeholder="e.g. team-standup-01" autocomplete="off" />
                <button class="btn-primary" id="createBtn" onclick="createRoom()">
                    <span class="spinner"></span><span class="label">Create</span>
                </button>
            </div>
            <p class="inline-error" id="lobbyError"></p>
            <button class="btn-secondary btn-full" id="joinBtn" onclick="joinRoom()">
                <span class="spinner"></span><span class="label">Join Room</span>
            </button>
        </section>

        <!-- Call -->
        <section id="callUI" class="hidden">
            <div class="room-info">
                <span class="badge host" id="roleBadge">Host</span>
                <span class="code" id="roomCode">—</span>
            </div>

            <div class="upload-box" id="uploadBox">
                <div class="label-row">
                    <label>Reference voice</label>
                    <span class="file-name" id="fileName">No file selected</span>
                </div>
                <input type="file" id="voiceFile" accept="audio/*,.wav,.mp3,.m4a,.aac,.caf,.ogg" onchange="onFileSelected()" />
                <label class="file-label" for="voiceFile">Choose WAV file (3–10s)</label>
                <button class="btn-secondary btn-full" id="uploadBtn"
                        style="margin-top:10px;" onclick="uploadVoice()">
                    <span class="spinner"></span><span class="label">Set Clone Voice</span>
                </button>
            </div>

            <p class="inline-error" id="callError"></p>
            <button class="btn-danger" id="closeRoomBtn" onclick="deleteRoom()"
                    style="display:none;">Close Room</button>
            <button class="btn-danger" onclick="leaveCall()">Leave Call</button>
        </section>
    </div>

    <!-- Toasts -->
    <div class="toast-container" id="toasts"></div>

    <!-- Lynkio JS client (served by the backend via serve_client=True) -->
    <script src="/lynkio/client.js"></script>
    <script>
    /* =====================================================
       UI HELPERS
    ===================================================== */
    function showToast(message, type = 'info', timeout = 4000) {
        const container = document.getElementById('toasts');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = message;
        container.appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => el.remove(), 300);
        }, timeout);
    }
    function setInlineError(id, msg) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = msg || '';
        el.classList.toggle('visible', !!msg);
    }
    function setLoading(id, loading) {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.classList.toggle('loading', loading);
        btn.disabled = loading;
    }
    function setConn(state) {
        const dot = document.getElementById('connDot');
        const text = document.getElementById('connText');
        dot.className = 'dot ' + state;
        text.textContent = state === 'connected' ? 'Connected'
                        : state === 'disconnected' ? 'Disconnected'
                        : 'Connecting…';
    }

    /* =====================================================
       STATE
    ===================================================== */
    let client = null;
    let isConnected = false;
    let roomId = null;
    let isHost = false;
    let micStarted = false;
    let micStream = null;
    let audioCtx = null;
    let micSource = null;
    let micProcessor = null;
    let silentGain = null;

    /* =====================================================
       INITIALIZE CONNECTION  (await client.connect())
    ===================================================== */
    async function initClient() {
        setConn('connecting');

        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        client = new LynkClient(`${wsProtocol}//${location.host}`);

        // Disable automatic reconnection so a deliberate close (e.g. room_closed)
        // does not trigger an endless reconnect loop.
        if ('autoReconnect' in client) client.autoReconnect = false;
        if ('reconnect' in client) client.reconnect = false;
        if (typeof client.setAutoReconnect === 'function') client.setAutoReconnect(false);

        /* ---------- server events ---------- */
        client.on('room_created', (data) => {
            roomId = data.room_id;
            isHost = true;
            setLoading('createBtn', false);
            enterCall();
            showToast(`Room "${roomId}" created. Waiting for a joiner.`, 'success');
        });

        client.on('room_joined', (data) => {
            roomId = data.room_id;
            isHost = false;
            setLoading('joinBtn', false);
            enterCall();
            showToast('Joined the room.', 'success');
        });

        client.on('joiner_connected', () => {
            showToast('Joiner connected.', 'success');
        });

        client.on('voice_ready', () => {
            setLoading('uploadBtn', false);
            showToast('Clone voice applied.', 'success');
        });

        client.on('cloned_audio', (buf) => playPCM(buf));
        client.on('raw_audio',    (buf) => playPCM(buf));

        client.on('room_closed', () => {
            showToast('The host closed the room.', 'warning');
            stopMic();
            try { if (typeof client.close === 'function') client.close(); } catch (_) {}
            setTimeout(() => window.location.reload(), 1200);
        });

        client.on('disconnected', () => {
            if (isConnected) {
                isConnected = false;
                setConn('disconnected');
                showToast('Disconnected from server.', 'warning');
                setLoading('createBtn', false);
                setLoading('joinBtn', false);
                setLoading('uploadBtn', false);
            }
        });

        client.on('error', (payload) => {
            const msg = (payload && payload.message) || 'Server error';
            const lobby = document.getElementById('lobby');
            if (lobby.classList.contains('hidden')) setInlineError('callError', msg);
            else setInlineError('lobbyError', msg);
            setLoading('createBtn', false);
            setLoading('joinBtn', false);
            setLoading('uploadBtn', false);
            showToast(msg, 'error');
        });

        /* ---------- connect ---------- */
        try {
            await client.connect();   // <-- REQUIRED: wait for the socket to open
            isConnected = true;
            setConn('connected');
            showToast('Connected to server.', 'success', 2500);
        } catch (error) {
            isConnected = false;
            setConn('disconnected');
            console.error('Lynkio connection error:', error);
            showToast('Unable to connect to server.', 'error');
        }
    }

    // Kick off the client once the DOM is ready.
    document.addEventListener('DOMContentLoaded', initClient);

    /* =====================================================
       LOBBY ACTIONS
    ===================================================== */
    function requireConnection() {
        if (!isConnected) {
            showToast('Waiting for the server connection…', 'warning');
            return false;
        }
        return true;
    }

    function createRoom() {
        if (!requireConnection()) return;
        const id = document.getElementById('roomInput').value.trim();
        if (!id) {
            setInlineError('lobbyError', 'Please enter a room code.');
            document.getElementById('roomInput').classList.add('invalid');
            return;
        }
        setInlineError('lobbyError', '');
        document.getElementById('roomInput').classList.remove('invalid');
        setLoading('createBtn', true);
        client.emit('create_room', { room_id: id });
    }

    function joinRoom() {
        if (!requireConnection()) return;
        const id = document.getElementById('roomInput').value.trim();
        if (!id) {
            setInlineError('lobbyError', 'Please enter a room code.');
            document.getElementById('roomInput').classList.add('invalid');
            return;
        }
        setInlineError('lobbyError', '');
        document.getElementById('roomInput').classList.remove('invalid');
        setLoading('joinBtn', true);
        client.emit('join_room', { room_id: id });
    }

    /* =====================================================
       CALL VIEW
    ===================================================== */
    async function enterCall() {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('callUI').classList.remove('hidden');
        document.getElementById('roomCode').textContent = roomId;

        const badge = document.getElementById('roleBadge');
        badge.textContent = isHost ? 'Host' : 'Joiner';
        badge.classList.toggle('host', isHost);

        if (isHost) {
            document.getElementById('uploadBox').classList.remove('hidden');
            document.getElementById('closeRoomBtn').style.display = 'block';
        } else {
            document.getElementById('uploadBox').classList.add('hidden');
            document.getElementById('closeRoomBtn').style.display = 'none';
        }
        await startMic();
    }

    function leaveCall() {
        stopMic();
        try { if (client && typeof client.close === 'function') client.close(); } catch (_) {}
        window.location.reload();
    }

    function deleteRoom() {
        if (!confirm('Close the room for everyone?')) return;
        client.emit('delete_room', { room_id: roomId });
    }

    /* =====================================================
       VOICE REFERENCE UPLOAD
    ===================================================== */
    function onFileSelected() {
        const file = document.getElementById('voiceFile').files[0];
        document.getElementById('fileName').textContent =
            file ? file.name : 'No file selected';
    }

    function uploadVoice() {
        if (!requireConnection()) return;
        const file = document.getElementById('voiceFile').files[0];
        if (!file) {
            setInlineError('callError', 'Select a WAV file before uploading.');
            return;
        }
        setInlineError('callError', '');
        setLoading('uploadBtn', true);

        const reader = new FileReader();
        reader.onload = () => {
            try {
                // Correct Lynkio method: sendBinaryEvent
                client.sendBinaryEvent('voice_reference', new Uint8Array(reader.result));
            } catch (err) {
                console.error('Voice upload error:', err);
                setLoading('uploadBtn', false);
                setInlineError('callError', 'Voice upload failed.');
            }
        };
        reader.onerror = () => {
            setLoading('uploadBtn', false);
            setInlineError('callError', 'Could not read the selected file.');
        };
        reader.readAsArrayBuffer(file);
    }

    /* =====================================================
       MIC CAPTURE
    ===================================================== */
    async function startMic() {
        if (micStarted) return;
        try {
            micStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true
                }
            });
            audioCtx = new AudioContext({ sampleRate: 24000 });
            await audioCtx.resume();

            micSource = audioCtx.createMediaStreamSource(micStream);
            micProcessor = audioCtx.createScriptProcessor(4096, 1, 1);

            silentGain = audioCtx.createGain();
            silentGain.gain.value = 0;

            micProcessor.onaudioprocess = (event) => {
                if (!micStarted || !isConnected) return;
                const input = event.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(input.length);
                for (let i = 0; i < input.length; i++) {
                    const s = Math.max(-1, Math.min(1, input[i]));
                    pcm16[i] = s < 0 ? s * 32768 : s * 32767;
                }
                try {
                    client.sendBinaryEvent('raw_mic', new Uint8Array(pcm16.buffer));
                } catch (err) {
                    console.error('Mic transmission error:', err);
                }
            };

            micSource.connect(micProcessor);
            micProcessor.connect(silentGain);
            silentGain.connect(audioCtx.destination);
            micStarted = true;
        } catch (err) {
            console.error('Microphone error:', err);
            showToast('Microphone access failed: ' + err.message, 'error');
        }
    }

    function stopMic() {
        micStarted = false;
        if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
        if (micSource)    { micSource.disconnect();    micSource = null; }
        if (silentGain)   { silentGain.disconnect();   silentGain = null; }
        if (micStream)    { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
        if (audioCtx)     { audioCtx.close(); audioCtx = null; }
    }

    /* =====================================================
       PCM PLAYBACK
    ===================================================== */
    function playPCM(data) {
        if (!data) return;
        if (!audioCtx || audioCtx.state === 'closed') {
            audioCtx = new AudioContext({ sampleRate: 24000 });
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        let pcm;
        if (data instanceof ArrayBuffer) {
            pcm = new Int16Array(data);
        } else if (ArrayBuffer.isView(data)) {
            pcm = new Int16Array(data.buffer, data.byteOffset,
                                 Math.floor(data.byteLength / 2));
        } else {
            return;
        }
        if (!pcm.length) return;

        const buffer = audioCtx.createBuffer(1, pcm.length, 24000);
        const ch = buffer.getChannelData(0);
        for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;

        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        src.connect(audioCtx.destination);
        src.start();
    }
    </script>
</body>
</html>
